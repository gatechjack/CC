# Manually curated K3 Kalshi watchlist seed.
#
# This list feeds `python -m trading_corp.scripts.seed_kalshi_watchlist`,
# which probes each handle via Apify and writes survivors to
# `agent_state(kalshi_copy_trader, watch_only_whales)`. The K3 watch-only
# path tracks their performance WITHOUT copy-trading them. Add the
# `[Promote]` button (BACKLOG WO-4) to move a handle from this list onto
# the live `selected_whales`.
#
# Inclusion rules:
#   - Tier 1: included if `fetch_profile` returns ANY profile row.
#     These are big-name public traders; track even with sparse data.
#   - Tier 2: included only if `fetch_trades` returns ≥ 1 row.
#     Curators / aggregators that don't trade on Kalshi are filtered out.
#
# Edit + re-run the script to add/remove handles. It is idempotent —
# overwrites the agent_state list each run.
#
# Source: public X.com posts surveyed 2026-05-15.

