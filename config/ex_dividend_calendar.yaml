# Ex-dividend dates for ETF universe symbols used by the
# Robinhood-joint iron-condor strategy.
#
# Phase 1: hand-maintained. The iron-condor Position Manager force-closes
# any open IC where the short call delta > 0.25 AND the underlying's ex-div
# date is within 3 trading days — to avoid early assignment on the call.
#
# Phase 1.5 (not in v1): auto-fetch from issuer pages so this file
# refreshes itself.
#
# Schema:
#   - symbol:    ticker (str, upper case)
#     ex_date:   YYYY-MM-DD — the trading-day-side ex-dividend date
#     pay_date:  YYYY-MM-DD — informational only; not used by the
#                force-close logic, but useful for audit/reconciliation
#     confirmed: bool — true if sourced from issuer's published 2026
#                schedule; false if projected from historical pattern
#     source:    short attribution string
#
# Coverage notes:
#   SPY  — SPDR (SSGA): quarterly. All four 2026 dates confirmed from the
#          SSGA "Calendar Year 2026 Dividend Distribution Schedule" PDF.
#   QQQ  — Invesco: quarterly. Q1 + Q2 confirmed from public dividend
#          trackers; Q3 + Q4 projected from Invesco's typical third-Monday
#          (or first business day of week 3) pattern.
#   IWM  — iShares: quarterly. Q1 + Q2 confirmed; Q3 + Q4 projected from
#          iShares' historical third-Monday pattern.
#   TLT  — iShares: monthly. Issuer-stated rule is "first business day of
#          each month." May and June 2026 confirmed via tracker sources;
#          the rest are extrapolated by that rule. Adjusted for weekends
#          (e.g. Aug 1 Sat → Aug 3 Mon; Nov 1 Sun → Nov 2 Mon) and the
#          New Year's Day market holiday (Jan 1 Thu → Jan 2 Fri).
#   GLD  — World Gold Trust: no regular dividends and no scheduled
#          capital gains distributions. Intentionally empty for v1.
#          GLD holds physical gold bullion; the trust generates no
#          dividend income or capital gains. Revisit if SSGA ever
#          declares a special distribution.
#
# ── MACE universe additions (Phase 1) ───────────────────────────────────
#   USO  — United States Oil Fund: a commodity-pool ETF that holds WTI
#          futures; pays NO distributions (stage-A verified 2026-08-09).
#          Intentionally empty — mace.yaml sets exdiv_guard: false.
#   IBIT — iShares Bitcoin Trust: spot-BTC grantor trust, no income and no
#          distributions. Intentionally empty — exdiv_guard: false
#          (and IBIT is overflow-only). Revisit only on a special distribution.
#   EWZ  — iShares MSCI Brazil: DOES distribute (historically semi-annual,
#          ~June + December, amounts/dates variable and declared only weeks
#          ahead, NOT a full year in advance). exdiv_guard: true in mace.yaml.
#          *** STRUCTURED-EMPTY: no confirmed 2026 ex-div dates yet. The
#          guard is INERT for EWZ until real issuer dates are populated here.
#          EWZ is DISABLED at launch; SOURCE iShares' 2026 distribution dates
#          before enabling it (gated expansion / Phase-5 config review). ***
#   FXI  — iShares China Large-Cap: DOES distribute (historically semi-annual,
#          ~June + December, variable). exdiv_guard: true in mace.yaml.
#          *** STRUCTURED-EMPTY: same as EWZ — no confirmed 2026 dates yet,
#          guard INERT until sourced; FXI is DISABLED at launch; SOURCE
#          iShares' dates before enabling (gated expansion). ***

