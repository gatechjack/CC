# Post-Earnings-Announcement-Drift, long-only US equities on the agentic
# Robinhood account (680725082). Autonomous (no per-trade approval) once the
# Board blesses the strategy; paper-first. Division wiring lands in Phase 2.
robinhood_pead:
  enabled: true                  # declarative; divisions.yaml standby:true is the operative gate
  auto_execute: true             # GO-LIVE 2026-06-24 (Board-authorized): PEAD trades autonomously, no HITL
  division: robinhood_pead

  # --- Universe screen — CONFIG-DRIVEN floors (retune without a code change) ---
  # Floors LOOSENED to match the Nasdaq Composite small/mid-cap tail, where
  # PEAD's edge concentrates. At THIS account size (tiny orders + fractional
  # shares on Robinhood) the binding constraint is "can a tiny order fill", NOT
  # "can I move size" — so the floors only screen out names too illiquid/dead
  # to fill at all. The >$1B institutional PEAD floor (which dodges small-cap
  # slippage-for-size) does NOT apply here and would delete the very tail the
  # Nasdaq Composite was chosen to reach.
  screen:
    min_price: 5.0
    min_avg_volume_30d: 200000      # 30d avg shares (was 1,000,000)
    min_market_cap: 100000000       # $100M (was $1B)
    min_days_to_next_earnings: 65   # trading days of drift room (unchanged)
    excluded_sectors: [financial services, financials, financial, utilities, utility]

  # --- SRW-SUE signal ---
  signal:
    lookback: 8           # trailing quarters of UE for the stdev denominator
    sue_threshold: 1.5    # long candidate requires SUE above this (z)
    top_quintile: true    # also require top-quintile SUE within the wave
    quintile_pct: 0.80

  # --- Phase-2 live wiring (2026-06-22): plumbing-validation values @ ~$75 ---
  # OPERATIVE kill-switch is divisions.yaml standby:true (scan+manage no-op);
  # auto_execute:false above keeps it paper even if standby is lifted. The
  # intended ~20-25 name book needs funding; max_concurrent caps the plumbing book.
  universe_file: "@config/nasdaq_composite.txt"   # 3,207-name Nasdaq Composite (anchored path)
  position_pct: 0.10                # 10% of account value per name
  max_concurrent_positions: 10      # plumbing book ceiling (~20-25 when funded)
  entry_delay_days: 1               # enter 1 trading day post-announcement...
  entry_max_delay_days: 2           # ...through 2 td (the PEAD entry window)
  manage_cadence_sec: 300           # exit-engine poll cadence
  scan_window_start_et: [8, 30]     # daily pre-open scan window (read at startup by main.py)
  scan_window_end_et: [9, 25]
  # --- Flag-2 deferred-fill reconcile (config-driven; defaults applied if absent) ---
  # PEAD scans pre-open, so entries are placed as GFD fractional buys that QUEUE to
  # the 9:30 open; a sibling reconcile loop confirms each fill at/after the open and
  # promotes it to a record. The deadline is anchored at the 9:30 OPEN (not at
  # placement) — an order still unfilled at open+deadline is the >5% collar miss
  # (cancel the resting order, skip the name, log it).
  reconcile_poll_interval_sec: 30          # reconcile-loop tick while pending orders exist
  reconcile_deadline_after_open_sec: 300   # wait past the 9:30 ET open before collar-miss cancel
  reconcile_partial_warn_frac: 0.90        # warn when realized $ < this fraction of requested

bitunix_sfp:
  enabled: true
  auto_execute: true
  execution_mode: live            # OPERATOR-SET paper|live at deploy
  mode: trading                    # two-state collapse (2026-06-27): REQUIRED for the LIVE BTC edge. Fail-safe default is halted, so this must be explicit "trading" or main.py will NOT start the 15m SFP loop on restart. Gates loop start only; SFP observer file is byte-unchanged.
  division: bitunix_sfp
  symbols: ["BTC/USDT.P", "ETH/USDT.P"]
  detection_tf: "15m"
  pivot_len: 50
  back_to_break: 4
  stop_buffer_pct: 0.001
  tp_r: 2.0
  watch_hours: 12
  side: long
  risk_pct_real: 0.1000            # OPERATOR-SET 2026-06-25 (conservative, below 0.005 default)
  risk_pct_considerable: 0.200    # OPERATOR-SET 2026-06-25 (conservative)
  leverage: 25.0                    # OPERATOR-SET 2026-06-25 (conservative, below 5.0 default)
  max_hold_seconds: 604800
  bar_cache_max_bars: 160
  loop_settle_seconds: 20
  # Mode B (15m SFP → 3m BOS), 2026-06-28. detection_tf stays 15m (SFP fires on
  # 15m); bos_tf per symbol selects 3m BOS confirmation. arm: trading = live
  # orders; arm: watch = detector runs but routes to PAPER (no-order forward-track).
  watch_hours_3m: 12               # 3m BOS watch window = 240 3m bars
  symbol_modes:
    "BTC/USDT.P": { bos_tf: "3m", arm: "trading" }   # live Mode B (replaces 15m-BOS, operator 2026-06-28)
    "ETH/USDT.P": { bos_tf: "3m", arm: "trading" }   # live Mode B, trivial size
