# Macro events that trigger a trading halt.
#
# Phase 1: hand-maintained. Add upcoming releases here (FOMC, CPI,
# NFP, Fed speakers).  The Lord Otter agent (and any other strategy
# wired to the macro calendar) will halt trading ±halt_window_minutes
# around each event.
#
# Phase 1.5: a fetcher will scrape ForexFactory + FRED's FOMC schedule
# and emit this same YAML shape automatically. Until then, refresh
# this file weekly. Stale events are harmless (date check filters).
#
# Schema:
#   - ts:     ISO 8601 datetime in UTC
#     impact: "high" | "medium" | "low"   (only "high" halts by default)
#     name:   short human label
#     source: where you got it (FOMC schedule URL, BLS calendar, etc.)
#
# Times must be in UTC. The Lord Otter agent reads UTC; conversion
# is the calendar's job to keep code simple.
#
# US DST in 2026: starts Sun 2026-03-08 02:00 local, ends Sun 2026-11-01 02:00 local.
# BLS releases (CPI, Employment Situation) are 08:30 ET = 13:30 UTC (EST) or 12:30 UTC (EDT).
# FOMC rate decision statement is 14:00 ET = 19:00 UTC (EST) or 18:00 UTC (EDT).
#
# 2026 dates sourced from the OMB/OIRA "Schedule of Release Dates for
# Principal Federal Economic Indicators for 2026"
# (https://www.whitehouse.gov/wp-content/uploads/2025/09/pfei_schedule_release_dates_cy2026.pdf)
# which mirrors the BLS schedule. FOMC dates from
# https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm.

