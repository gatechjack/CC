<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source-of-truth Trading Corp icon.

  This is the single SVG art file. PNG icons (for iOS apple-touch-icon
  and the PWA manifest) are generated from this via
  scripts/generate_pwa_icons.py.

  Edit this file to change the app icon, then re-run the generator.
  Colors mirror the existing TC monogram in the dashboard header
  (accent blue → emerald gradient).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Solid rounded square; iOS auto-masks, Android uses the maskable safe zone -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- TC monogram -->
  <text x="256" y="332" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="220" font-weight="800" letter-spacing="-8"
        text-anchor="middle" fill="#070b14">TC</text>
</svg>
