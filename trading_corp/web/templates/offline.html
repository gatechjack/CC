<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Trading Corp — Offline</title>

  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon-180.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
  <link rel="stylesheet" href="/static/css/app.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #070b14;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 96px;
      height: 96px;
      margin-bottom: 1rem;
      opacity: 0.6;
    }
    h1 {
      margin: 0.5rem 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.011em;
    }
    p {
      max-width: 32ch;
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0.25rem 0;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.6rem 1.2rem;
      background: #3b82f6;
      color: white;
      border: 0;
      border-radius: 0.5rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }
    button:hover { background: #2563eb; }
    .meta {
      margin-top: 1rem;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 0.7rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <img class="icon" src="/static/icon.svg" alt="" />
  <h1>You're offline</h1>
  <p>Trading Corp can't reach the server right now.</p>
  <p>Pull-to-refresh once your connection is back, or tap the button below.</p>
  <button onclick="location.reload()">Try again</button>
  <div class="meta">offline mode</div>

  <script>
    // Auto-refresh as soon as we're back online — saves a tap.
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
