{% extends "base.html" %}

<div class="bg-pane border border-edge rounded-lg p-12 text-center">

              text-[11px] uppercase tracking-widest text-muted font-mono mb-4">
    phase {{ phase }}
  </div>
  <h1 class="text-2xl font-semibold text-mono">{{ title }}</h1>
  <p class="mt-2 text-muted text-sm">

  </p>
  <a href="/" class="inline-block mt-6 px-4 py-2 rounded-md bg-accent text-white
                     hover:bg-accent/80 transition-colors text-sm font-medium">

  </a>
</div>
{% endblock %}
